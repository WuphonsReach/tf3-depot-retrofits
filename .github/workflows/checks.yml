# PR checks. There is no build and no deploy (uploads are done by hand in the game), and the type check needs the game's own
# type definitions, which are not in the repo, so this is the part that can run anywhere.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Every file under content/ is in _content.json
        run: python3 tools/check_content_list.py
      # Locally a test logLevel is only a warning; here it fails, so it cannot reach main.
      - name: settings.tl ships logLevel "summary"
        run: python3 tools/check_repo.py --strict
      - name: Tools compile
        run: python3 -m py_compile tools/*.py

  teal-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Teal compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks lua5.1
          sudo luarocks install tl 0.24.8
      # tl gen stops only on syntax errors; the type check (tl check) needs the game's tealdef folders, so it stays a local step.
      - name: Teal files parse
        run: |
          for f in depot_retrofits_1/content/*.tl; do
            echo "== $f"
            tl gen "$f" -o /dev/null
          done
      # The game script is plain Lua, which tl does not see; a syntax error there breaks the game script's load.
      - name: Lua files parse
        run: |
          for f in depot_retrofits_1/content/*.lua; do
            echo "== $f"
            luac5.1 -p "$f"
          done
      # How other mods load the depot wrapper (the TRM: Industry Emissions fix), on the generated code; needs tl and lua5.1 only.
      - name: Wrapper load tests
        run: python3 tools/test_wrapper_load.py
      - name: JSON files parse
        run: |
          for f in depot_retrofits_1/mod.json depot_retrofits_1/_content.json depot_retrofits_1/_metadata/modinfo.json; do
            echo "== $f"
            python3 -m json.tool "$f" > /dev/null
          done
